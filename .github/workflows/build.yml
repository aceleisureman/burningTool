name: Build & Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test, lint and build renderer
        run: npm run check

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac --universal
          - os: ubuntu-latest
            args: --linux AppImage --x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 每次构建生成递增版本号 1.0.<构建号>，electron-updater 依赖版本号判断是否有新版
      - name: Set build version
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version

      # electron-builder 直接发布到 GitHub Release（tag v1.0.<构建号>），
      # 同时上传 latest.yml / latest-mac.yml / latest-linux.yml 供应用内自动更新。
      # macOS：必须产出 zip（dmg 仅给人手工安装）；当前无 Apple 开发者证书，
      # 关闭签名发现并显式 CSC_IDENTITY_AUTO_DISCOVERY=false，与 package.json mac.identity=null 一致。
      # 应用侧 macOS updater 使用 zip 下载后本地替换 .app，未签名构建不再走 ShipIt。
      - name: Build & publish
        shell: bash
        run: npx vite build && npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # 避免 macOS 构建在无证书环境误走签名/公证流程
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
